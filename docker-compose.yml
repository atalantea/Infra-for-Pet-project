services:
  frontend:
    build: ./todo-app-frontend
    container_name: react-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./todo-app-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
  
  backend:
    build: ./todo-app-backend
    container_name: fastapi-backend-dev
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    volumes:
      - ./todo-app-backend:/home/appuser/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d todo"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: