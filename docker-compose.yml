services:
  frontend:
    build: ./todo-app-frontend
    container_name: react-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./todo-app-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
  
  backend:
    build: ./todo-app-backend
    container_name: fastapi-backend-dev
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./todo-app-backend:/home/appuser/app
      - ./.env:/home/appuser/app/.env:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5m
      timeout: 3s
      retries: 5
      start_period: 20s
    command: ["uvicorn", "app.pet-project:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: