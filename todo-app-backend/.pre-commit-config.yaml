repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: ruff check . --fix
        language: system
        pass_filenames: false
        types_or: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format .
        language: system
        pass_filenames: false
        types_or: [python]

      - id: mypy
        name: mypy
        entry: cmd /c "cd todo-app-backend && mypy"
        language: system
        pass_filenames: false
        types_or: [python]

      - id: pytest
        name: pytest
        entry: pytest # todo-app-backend
        language: system
        pass_filenames: false
        types_or: [python]
        # stages: [pre-push]